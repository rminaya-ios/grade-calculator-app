<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --brand:#1e3a8a; --brand-soft:#eef2ff; --ok:#047857; --warn-bg:#fffbeb; --warn-line:#f59e0b; --info-bg:#ecfdf5; --info-line:#10b981; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color:var(--ink); background:#f8fafc; line-height:1.45; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; color: var(--brand); }
  h2.step { font-size: 1.1rem; margin: 22px 0 10px; }
  h2.step span { display:inline-block; width:26px; height:26px; line-height:26px; text-align:center; border-radius:50%; background:var(--brand); color:#fff; font-size:.9rem; margin-right:6px; }
  .sub { color: var(--muted); margin: 0 0 8px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:14px; }
  .types { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:10px; }
  .type { text-align:left; background:#fff; border:2px solid var(--line); border-radius:12px; padding:14px; cursor:pointer; font:inherit; color:inherit; }
  .type b { display:block; color:var(--brand); font-size:1.02rem; margin-bottom:2px; }
  .type:hover { border-color:#93c5fd; }
  .type.sel { border-color:var(--brand); background:var(--brand-soft); }
  .prep { border-left-width:6px; }
  .prep.mastery { background:var(--warn-bg); border-color:var(--warn-line); }
  .prep.support { background:var(--info-bg); border-color:var(--info-line); }
  .day h3 { margin:0 0 10px; font-size:1.02rem; }
  .slots { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
  .slot { border:1px solid var(--brand); background:#fff; color:var(--brand); border-radius:8px; padding:10px 8px; font-size:.95rem; cursor:pointer; text-align:center; font-weight:600; }
  .slot:hover, .slot:focus { background:var(--brand-soft); outline:none; }
  .slot.sel { background:var(--brand); color:#fff; }
  .slot[disabled] { border-color:var(--line); background:#f3f4f6; color:#9ca3af; cursor:not-allowed; font-weight:400; }
  .slot small { display:block; font-size:.75rem; font-weight:400; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  input[type=text], input[type=email] { width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-size:1rem; }
  .check { display:flex; gap:10px; align-items:flex-start; font-weight:400; margin-top:14px; }
  .check input { margin-top:4px; width:18px; height:18px; flex:none; }
  button.primary, button.ghost { margin-top:16px; border-radius:8px; padding:12px 18px; font-size:1rem; font-weight:600; cursor:pointer; }
  button.primary { background:var(--brand); color:#fff; border:0; }
  button.ghost { background:#fff; color:var(--brand); border:1px solid var(--brand); margin-top:0; }
  button.primary[disabled] { opacity:.5; cursor:not-allowed; }
  .err { color:#b91c1c; margin-top:10px; }
  .ok h2 { color:var(--ok); margin-top:0; }
  .muted { color:var(--muted); font-size:.9rem; font-weight:400; }
  .legend { display:flex; gap:16px; font-size:.85rem; color:var(--muted); margin-bottom:12px; flex-wrap:wrap; }
  .sw { display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-2px; margin-right:4px; border:1px solid var(--brand); }
  .sw.na { background:#f3f4f6; border-color:var(--line); }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Schedule a Meeting</h1>
  <p class="sub" id="subtitle">Loading available times…</p>

  <div id="main" class="hidden">
    <h2 class="step"><span>1</span>What do you need?</h2>
    <div class="types" id="types"></div>
    <div class="card prep hidden" id="prepCard" style="margin-top:12px">
      <b id="prepTitle"></b>
      <div id="prep" style="margin-top:4px"></div>
    </div>

    <div id="step2" class="hidden">
      <h2 class="step"><span>2</span>Pick a 10-minute time</h2>
      <div class="legend"><span><span class="sw"></span>Available</span><span><span class="sw na"></span>Unavailable</span></div>
      <div id="days"></div>
      <button class="ghost hidden" id="moreBtn">Show more dates</button>
    </div>

    <div class="card hidden" id="form" style="margin-top:16px">
      <h2 class="step" style="margin-top:0"><span>3</span>Confirm</h2>
      <p id="picked" style="margin:0"></p>
      <label for="name">Full name</label>
      <input type="text" id="name" autocomplete="name">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email">
      <label for="topic">What would you like to work on? <span class="muted">(optional)</span></label>
      <input type="text" id="topic" maxlength="300" placeholder="e.g., Section 4.2 #15–20, solving systems of equations">
      <label class="check hidden" id="readyRow"><input type="checkbox" id="ready"><span id="readyText"></span></label>
      <button class="primary" id="bookBtn" disabled>Book this time</button>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div class="card ok hidden" id="done">
    <h2>You're booked!</h2>
    <p id="doneText"></p>
    <p class="muted">A confirmation email is on its way. If you need to change or cancel, reply to that email.</p>
    <button class="primary" id="againBtn">Book another time</button>
  </div>
</div>

<script>
  var COURSE = <?= courseCode ?>;
  var DAYS_PER_PAGE = 6;
  var view = null, type = null, selected = null, shownDays = DAYS_PER_PAGE;
  var $ = function (id) { return document.getElementById(id); };

  function load() {
    google.script.run.withSuccessHandler(render).withFailureHandler(fail).getCourseView(COURSE);
  }
  function fail() { $('subtitle').textContent = 'Something went wrong loading the schedule. Please refresh the page.'; }

  function render(v) {
    view = v;
    if (!v.ok) { $('subtitle').textContent = v.error; return; }
    $('title').textContent = v.title;
    $('subtitle').textContent = '10-minute, in-person meetings with ' + v.instructor +
      '. You may have up to ' + v.maxPerStudent + ' upcoming meeting' + (v.maxPerStudent > 1 ? 's' : '') + ' at a time.';
    $('types').innerHTML = v.types.map(function (t) {
      return '<button class="type' + (type && type.key === t.key ? ' sel' : '') + '" data-key="' + esc(t.key) + '"><b>' +
        esc(t.label) + '</b><span class="muted">' + esc(t.short) + '</span></button>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.type'), function (b) {
      b.onclick = function () { chooseType(b.dataset.key); };
    });
    if (v.types.length === 1 && !type) chooseType(v.types[0].key);
    renderDays();
    $('main').classList.remove('hidden');
  }

  function chooseType(key) {
    type = view.types.filter(function (t) { return t.key === key; })[0];
    Array.prototype.forEach.call(document.querySelectorAll('.type'), function (b) {
      b.classList.toggle('sel', b.dataset.key === key);
    });
    $('prepCard').className = 'card prep ' + key;
    $('prepTitle').textContent = 'Before you book: ' + type.label;
    $('prep').innerHTML = type.prep;
    $('readyText').textContent = type.readyText;
    $('readyRow').classList.toggle('hidden', !type.readyText);
    $('ready').checked = false;
    $('step2').classList.remove('hidden');
    if (selected) $('picked').innerHTML = pickedHtml();
    validate();
  }

  function renderDays() {
    var html = '';
    if (!view.days.length) html = '<div class="card">There are no upcoming times right now. Please check back later or contact ' + esc(view.instructor) + '.</div>';
    view.days.slice(0, shownDays).forEach(function (d) {
      var open = d.slots.filter(function (s) { return s.available; }).length;
      html += '<div class="card day"><h3>' + esc(d.label) + ' <span class="muted">· ' + open + ' open · ' + esc(d.slots[0].room) + '</span></h3><div class="slots">';
      d.slots.forEach(function (s) {
        html += s.available
          ? '<button class="slot' + (selected && selected.id === s.id ? ' sel' : '') + '" data-id="' + esc(s.id) + '" data-label="' + esc(d.label + ', ' + s.label) + '" data-room="' + esc(s.room) + '">' + esc(s.label) + '</button>'
          : '<button class="slot" disabled aria-label="' + esc(s.label) + ' unavailable">' + esc(s.label) + '<small>Unavailable</small></button>';
      });
      html += '</div></div>';
    });
    $('days').innerHTML = html;
    $('moreBtn').classList.toggle('hidden', view.days.length <= shownDays);
    Array.prototype.forEach.call(document.querySelectorAll('.slot[data-id]'), function (b) {
      b.onclick = function () { pick(b.dataset.id, b.dataset.label, b.dataset.room); };
    });
  }
  $('moreBtn').onclick = function () { shownDays += DAYS_PER_PAGE; renderDays(); };

  function pickedHtml() {
    return '<b>' + esc(type.label) + '</b><br>' + esc(selected.label) + ' · ' + esc(selected.room);
  }

  function pick(id, label, room) {
    selected = { id: id, label: label, room: room };
    Array.prototype.forEach.call(document.querySelectorAll('.slot[data-id]'), function (b) {
      b.classList.toggle('sel', b.dataset.id === id);
    });
    $('picked').innerHTML = pickedHtml();
    $('err').textContent = '';
    $('form').classList.remove('hidden');
    $('form').scrollIntoView({ behavior: 'smooth', block: 'center' });
    validate();
  }

  function validate() {
    var readyOk = !type || !type.readyText || $('ready').checked;
    $('bookBtn').disabled = !(type && selected && $('name').value.trim() && $('email').value.trim() && readyOk);
  }
  ['name', 'email'].forEach(function (id) { $(id).addEventListener('input', validate); });
  $('ready').addEventListener('change', validate);

  $('bookBtn').onclick = function () {
    $('bookBtn').disabled = true; $('bookBtn').textContent = 'Booking…'; $('err').textContent = '';
    google.script.run.withSuccessHandler(function (r) {
      $('bookBtn').textContent = 'Book this time';
      if (r.ok) {
        $('main').classList.add('hidden'); $('form').classList.add('hidden');
        $('doneText').innerHTML = '<b>' + esc(r.type) + '</b><br>' + esc(r.when) + '<br>' + esc(r.room);
        $('done').classList.remove('hidden');
        selected = null;
      } else {
        $('err').textContent = r.error; validate();
        if (r.taken) { selected = null; $('form').classList.add('hidden'); load(); }
      }
    }).withFailureHandler(function () {
      $('bookBtn').textContent = 'Book this time'; validate();
      $('err').textContent = 'Could not reach the server. Please try again.';
    }).bookSlot(COURSE, selected.id, $('name').value, $('email').value, type.key, $('topic').value, $('ready').checked);
  };

  $('againBtn').onclick = function () {
    $('done').classList.add('hidden'); $('topic').value = ''; $('ready').checked = false;
    selected = null; validate(); load();
  };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  load();
</script>
</body>
</html>
